name: FormBuddy
options:
  bundleIdPrefix: com.formbuddy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  postGenCommand: pod install

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGN_STYLE: "Automatic"

targets:
  FormBuddy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FormBuddy
    info:
      path: FormBuddy/Info.plist
      properties:
        NSCameraUsageDescription: "FormBuddy records exercise clips to analyze your form."
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.formbuddy.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: "FormBuddy/Info.plist"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  FormBuddyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/FormBuddyTests
    dependencies:
      - target: FormBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.formbuddy.app.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  FormBuddy:
    build:
      targets:
        FormBuddy: all
        FormBuddyTests: [test]
    test:
      targets:
        - FormBuddyTests
      gatherCoverageData: false
    run:
      config: Debug
