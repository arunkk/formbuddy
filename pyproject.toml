[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "formbuddy"
version = "0.1.0"
description = "AI-powered form analysis for weight training"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10,<1.0",
    "opencv-python",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
formbuddy = "formbuddy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
formbuddy = ["assets/*.task"]

[tool.pytest.ini_options]
testpaths = ["tests"]
